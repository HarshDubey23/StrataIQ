name: Keep the database awake

# Weekly, not every 10 minutes: on Render's free tier a ping that keeps the API awake
# around the clock uses up the workspace's 750 instance hours. Once a week is enough
# to stop the free Supabase project from being paused for inactivity (/api/health runs
# `select 1`). The first visit after a quiet spell still takes about a minute.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 "https://strataiq-api-c2dc.onrender.com/api/health" || true)
          echo "api health -> $code"
