name: Live smoke test

# Runs the judge journey against the PUBLIC deployment after each push to main
# (waits for the Azure deployment to answer) and publishes screenshots to the `live-results` branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      BASE_URL: https://strataiq-app.centralindia.cloudapp.azure.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for the new deployment
        run: |
          sleep 60
          for i in $(seq 1 30); do curl -sf https://strataiq-app.centralindia.cloudapp.azure.com/api/health && break; sleep 10; done
      - name: Live site and API answer
        run: |
          curl -sf --max-time 60 "$BASE_URL/api/health" | tee health.json
          grep -q '"status":"ok"' health.json && grep -q '"db":true' health.json
          curl -sf --max-time 60 "$BASE_URL/" -o home.html
          grep -q "Know your" home.html
      # The full click-through journey below was written for the earlier India UI. Run it by hand
      # (Actions > Live smoke test > Run workflow) until it is rewritten for the current UI.
      - name: Journey on live URL
        if: github.event_name == 'workflow_dispatch'
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          node live.mjs
      - name: Publish results to live-results branch
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p /tmp/res && cp -r e2e/out-live/* /tmp/res/ 2>/dev/null || true
          cd /tmp/res
          git init -q -b live-results
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "live results for ${GITHUB_SHA}" || true
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live-results
