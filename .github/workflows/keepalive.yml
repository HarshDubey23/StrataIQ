name: Keep the database awake

# Weekly health check of the live API on Azure and its database
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ping API health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 180 "https://strataiq-app.centralindia.cloudapp.azure.com/api/health" || true)
          echo "api health -> $code"
